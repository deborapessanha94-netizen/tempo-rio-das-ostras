name: Previsão Meteorológica Oficial Autônoma 24/7 (07:00 e 17:00 BRT + Monitoramento Horário)

on:
  schedule:
    # 07:00 BRT (10:00 UTC) e 17:00 BRT (20:00 UTC) - Emissões Oficiais da Defesa Civil
    - cron: '0 10,20 * * *'
    # Monitoramento contínuo 24/7 de 1 em 1 hora para telemetria e novos alertas do INMET/Marinha
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: sync-meteorology
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl || true

      - name: Executar Coleta de Todas as Fontes e Gerar Previsão Autônoma a partir de Hoje
        run: |
          python scripts/collector.py
          python scripts/auto_bulletin.py
          python scripts/sync_data.py

      - name: Salvar Dados Atualizados no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-sync): atualizacao horaria 24/7 de todas as fontes oficiais [skip ci]"
            git pull --rebase -X theirs origin main || git pull -s recursive -X theirs origin main
            git push origin main
          fi

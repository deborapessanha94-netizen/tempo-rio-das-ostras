name: Sincronização e Previsão Meteorológica Oficial 24/7 (A cada 5 minutos em Nuvem)

on:
  schedule:
    # Atualização contínua em nuvem a cada 5 minutos (mesmo com computador desligado)
    - cron: '*/5 * * * *'
    # Rodadas Oficiais de Previsão Numérica do INMET COSMO 7x7km (00:00 UTC e 12:00 UTC)
    - cron: '0 0,12 * * *'
    # Horários Oficiais dos Boletins Operacionais (07:00 e 17:00 BRT -> 10:00 e 20:00 UTC)
    - cron: '0 10,20 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: sync-meteorology
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl reportlab matplotlib || true

      - name: Executar Coleta e Síntese Completa de Todas as Fontes Oficiais
        run: |
          python scripts/sync_jundia_10d.py || true
          python scripts/stations_service.py || true
          python scripts/sync_data.py || true
          python scripts/collector.py || true

      - name: Salvar Dados e Boletins Atualizados no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ img/
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-sync): atualizacao 24/7 em nuvem a cada 5 min [skip ci]"
            git push origin main || (git fetch origin main && git merge -X theirs origin/main -m "merge auto-sync [skip ci]" && git push origin main)
          fi

name: Sincronização Automática das Fontes Oficiais 24/7

on:
  schedule:
    # Executa a cada 5 minutos na nuvem do GitHub (mesmo com computador desligado)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite disparar manualmente
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Sincronização com Órgãos Oficiais (INEA & INMET)
        run: |
          python scripts/sync_data.py

      - name: Salvar Dados Atualizados no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Auto-Sync 24/7: Cotas e telemetria INEA sincronizadas a cada 5 min [skip ci]" && git push)

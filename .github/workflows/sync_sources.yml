name: Sincronização e Previsão Diária das 17:00 (24/7)

on:
  schedule:
    # Rodada Oficial Diária das 17:00 BRT (20:00 UTC)
    - cron: '0 20 * * *'
    # Monitoramento contínuo de telemetria a cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Coletor Oficial das 17:00 e Telemetria
        run: |
          python scripts/collector.py
          python scripts/sync_data.py

      - name: Salvar Dados Atualizados no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Auto-Sync 24/7: Rodada diária oficial e telemetria atualizadas [skip ci]" && git push)
